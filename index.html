<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>To-Do List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
        }
        input[type="text"] {
            width: 70%;
            padding: 8px;
            font-size: 16px;
        }
        button {
            padding: 8px 12px;
            font-size: 16px;
            margin-left: 5px;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            background: #f2f2f2;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .edit-mode input[type="text"] {
            width: 100%;
        }
    </style>
</head>
<body>

    <h1>📝 To-Do List</h1>

    <div>
        <input type="text" id="taskInput" placeholder="Vazifa yozing...">
        <button onclick="addTask()">Qo‘shish</button>
    </div>

    <ul id="taskList"></ul>

    <script>
        const taskInput = document.getElementById("taskInput");
        const taskList = document.getElementById("taskList");

        let tasks = [];

        function renderTasks() {
            taskList.innerHTML = '';
            tasks.forEach((task, index) => {
                const li = document.createElement("li");

                if (task.editing) {
                    const input = document.createElement("input");
                    input.type = "text";
                    input.value = task.text;

                    const saveBtn = document.createElement("button");
                    saveBtn.textContent = "Saqlash";
                    saveBtn.onclick = () => saveTask(index, input.value);

                    li.appendChild(input);
                    li.appendChild(saveBtn);
                } else {
                    li.innerHTML = `
                        <span>${task.text}</span>
                        <div>
                            <button onclick="editTask(${index})">✏️</button>
                            <button onclick="deleteTask(${index})">🗑️</button>
                        </div>
                    `;
                }

                taskList.appendChild(li);
            });
        }

        function addTask() {
            const text = taskInput.value.trim();
            if (text !== '') {
                tasks.push({ text: text, editing: false });
                taskInput.value = '';
                renderTasks();
            }
        }

        function deleteTask(index) {
            tasks.splice(index, 1);
            renderTasks();
        }

        function editTask(index) {
            tasks = tasks.map((t, i) => ({
                ...t,
                editing: i === index
            }));
            renderTasks();
        }

        function saveTask(index, newText) {
            tasks[index].text = newText;
            tasks[index].editing = false;
            renderTasks();
        }

        // Boshlang‘ich render
        renderTasks();
    </script>

</body>
</html>
